# Render Blueprint — $0 setup for a first, low-traffic launch. Postgres and Redis are NOT
# provisioned here: Render's own free Postgres expires after 30 days, and its Background Worker
# instance type isn't available on the free plan at all, so this deploys a single free Web
# Service (API + the stock-hold worker running in the same process — see
# RUN_WORKER_IN_PROCESS in src/server.ts) and points it at externally hosted free databases:
#   - Postgres: neon.tech (free, doesn't expire, scales to zero on idle)
#   - Redis:    upstash.com (free, TCP-compatible with ioredis — no code changes needed)
#
# Tradeoffs of this $0 setup, so they're written down instead of just discovered later:
#   - The free Web Service sleeps after 15 minutes with no HTTP traffic; the next request pays
#     a 30-60s cold start.
#   - Because the worker runs in that same process, a stock hold's expiry can be delayed past
#     its 15-minute deadline if the service was asleep — it fires on the next request instead of
#     exactly on time. Not a correctness bug (nothing double-sells), just a timing slip.
#   - Neon/Upstash free tiers also cold-start/rate-limit at very low, but nonzero, thresholds.
# When real traffic justifies it, split the worker back out: run worker.ts as its own Render
# Background Worker (paid) or equivalent, and drop RUN_WORKER_IN_PROCESS.
#
# One-time manual steps after applying this blueprint (see the `sync: false` vars below):
#   1. DATABASE_URL — your Neon connection string.
#   2. REDIS_URL — your Upstash Redis connection string (the TCP one, not the REST URL).
#   3. CULQI_SECRET_KEY, and RESEND_API_KEY once you have a Resend account.
#   4. Once the frontend is deployed (Vercel), set COOKIE_DOMAIN, CORS_ORIGIN, and FRONTEND_URL
#      to its real URL — Render redeploys automatically.
#
# JWT_ACCESS_SECRET/JWT_REFRESH_SECRET use generateValue: true — Render generates and stores
# these itself; nothing to fill in, and they're never written into this file.

services:
  - name: flashkings-api
    type: web
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STOCK_HOLD_MINUTES
        value: "15"
      - key: PAYMENT_GATEWAY
        value: culqi
      - key: CULQI_PUBLIC_KEY
        value: pk_test_Xn6LmPWINJNMzj7R
      - key: CULQI_SECRET_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Flashkings <pedidos@flashkings.pe>"
      - key: WHATSAPP_BUSINESS_PHONE
        value: "51927439841"
      - key: COOKIE_DOMAIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
